name: SAST-SCA-SS

on:
  push:

  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: fluidattacks/sast-action@1.3.0
        id: sast
        with:
          scan_config_path: .github/scan-config.yaml

      - name: Guardar resultados SAST
        if: always()
        run: cp results.csv sast-results.csv 2>/dev/null || true

      - uses: fluidattacks/sca-action@1.2.0
        id: sca
        with:
          scan_config_path: .github/scan-config.yaml

      - name: Guardar resultados SCA
        if: always()
        run: cp results.csv sca-results.csv 2>/dev/null || true

      - uses: fluidattacks/ss-action@0.2.0
        id: ss
        with:
          scanner_mode: full
          scan_config_path: .github/scan-config.yaml

      - name: Guardar resultados SS
        if: always()
        run: cp results.csv ss-results.csv 2>/dev/null || true

      - name: Combinar CSVs
        if: always()
        run: |
          head -1 results.csv > all-results.csv
          for f in sast-results.csv sca-results.csv ss-results.csv; do
            [ -f "$f" ] && tail -n +2 "$f" >> all-results.csv || true
          done
          echo "=== Total de hallazgos ==="
          wc -l all-results.csv

      - name: Upload CSV Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-results
          path: all-results.csv
