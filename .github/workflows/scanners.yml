name: SAST-SCA-SS

on:
  push:

  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:                    # ← esto faltaba
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: fluidattacks/sast-action@1.3.0
        id: sast
        with:
          scan_config_path: .github/scan-config.yaml

      - uses: fluidattacks/sca-action@1.2.0
        id: sca
        with:
          scan_config_path: .github/scan-config.yaml

      - uses: fluidattacks/ss-action@0.2.0
        id: ss
        with:
          scanner_mode: full
          scan_config_path: .github/scan-config.yaml

      - name: Debug - Ver archivos generados
        if: always()
        run: |
          echo "=== Archivos en el directorio raíz ==="
          ls -la
          echo "=== Buscando archivos CSV ==="
          find . -name "*.csv" 2>/dev/null
          echo "=== Contenido de results.csv si existe ==="
          cat results.csv 2>/dev/null || echo "Archivo no encontrado o vacío"

      - name: Upload CSV Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-results
          path: results.csv
