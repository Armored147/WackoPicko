name: SAST-SCA-SS

on:
  push:

  pull_request:
    types:
      - opened
      - synchronize
      - reopened

  # schedule:
  #   - cron: "0 8 * * 1"

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: fluidattacks/sast-action@1.3.0
        id: sast
        with:
          scan_config_path: .github/sast-config.yaml

      - uses: fluidattacks/sca-action@1.2.0
        id: sca
        with:
          scan_config_path: .github/sast-config.yaml

      - uses: fluidattacks/ss-action@0.2.0
        id: ss
        with:
          scan_config_path: .github/sast-config.yaml

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.sast.outputs.sarif_file }}
      # Optional: upload findings to the GitHub Security tab
  
      - name: Upload CSV Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-results
          path: results.csv
